<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0D13">
<title>pvedrill — edge monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0A0D13; --panel:#12161F; --line:#1E2530; --text:#D6DCE6; --mut:#78828F;
  --amber:#F5B84B; --up:#34D399; --dn:#F87171; --sol:#A15CFF; --eth:#7B94F5;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 74px);
  max-width:720px;margin:0 auto}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header h1{font-size:15px;letter-spacing:.22em;font-weight:700;color:var(--amber);font-family:ui-monospace,"SF Mono",Menlo,monospace}
header .tag{font-size:11px;color:var(--mut);letter-spacing:.08em}
#status{font-size:12px;color:var(--mut);margin:4px 0 12px;min-height:16px}
#status.err{color:var(--dn)}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--mut);font:600 13px/1 inherit;
  font-family:inherit;padding:10px 0;border-radius:10px;cursor:pointer}
.chips button.on{color:#0A0D13;background:var(--amber);border-color:var(--amber)}
.dates{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.dates input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:9px 10px;font:16px/1 inherit;min-width:0}
.dates span{color:var(--mut)}
#wallet{width:100%;background:none;border:none;color:var(--mut);font:11px/1 ui-monospace,Menlo,monospace;
  padding:2px 2px 10px;overflow:hidden;text-overflow:ellipsis}
section[hidden]{display:none}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.cell .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.cell .v{font-size:22px;font-weight:600;margin-top:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.cell .s{font-size:11px;color:var(--mut);margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.up{color:var(--up)} .dn{color:var(--dn)} .sol{color:var(--sol)} .eth{color:var(--eth)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.panel .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.panel.sig{border-color:rgba(245,184,75,.45)}
.panel.sig .k{color:var(--amber)}
.ch{position:relative;height:230px}
.seg{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.seg button{background:var(--panel);border:1px solid var(--line);color:var(--mut);font:600 12px/1 inherit;
  font-family:inherit;padding:9px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.seg button.on{color:var(--amber);border-color:var(--amber)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .l{min-width:0}
.row .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:11px;color:var(--mut);margin-top:1px;font-family:ui-monospace,Menlo,monospace}
.row .r{text-align:right;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;white-space:nowrap}
.row .r .m{font-weight:400}
.empty{color:var(--mut);font-size:13px;padding:14px 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;
  background:rgba(10,13,19,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
.tabs button{flex:1;max-width:180px;background:none;border:none;color:var(--mut);font:600 11px/1.2 inherit;
  font-family:inherit;letter-spacing:.06em;padding:7px 0;cursor:pointer;border-radius:10px}
.tabs button .i{display:block;font-size:16px;margin-bottom:2px}
.tabs button.on{color:var(--amber)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>PVEDRILL</h1>
  <span class="tag">edge monitor · polymarket data-api · realized only</span>
  <div id="status">loading…</div>
</header>

<div class="chips" id="chips">
  <button data-d="1">24h</button>
  <button data-d="7" class="on">7d</button>
  <button data-d="30">30d</button>
  <button data-d="0">all</button>
</div>
<div class="dates">
  <input type="date" id="dFrom" aria-label="from date">
  <span>→</span>
  <input type="date" id="dTo" aria-label="to date">
</div>
<input id="wallet" value="0x92fae79010ef399d035523a8b7d805fcc1f28b17" spellcheck="false" aria-label="wallet">

<main>
<section id="sec-ov">
  <div class="cells" id="cells"></div>
  <div class="panel"><div class="k">cumulative realized pnl</div><div class="ch"><canvas id="cCum"></canvas></div></div>
  <div class="panel"><div class="k" id="kDaily">pnl per day</div><div class="ch"><canvas id="cDaily"></canvas></div></div>
</section>

<section id="sec-edge" hidden>
  <div class="panel sig"><div class="k">edge curve — realized minus implied, pp per entry bucket</div><div class="ch"><canvas id="cEdgeB"></canvas></div></div>
  <div class="panel"><div class="k">pnl per entry bucket</div><div class="ch"><canvas id="cBP"></canvas></div></div>
  <div class="panel"><div class="k">calibration — realized vs implied win rate</div><div class="ch"><canvas id="cCal"></canvas></div></div>
  <div class="panel"><div class="k">rolling edge per share — last 50 markets</div><div class="ch"><canvas id="cRoll"></canvas></div></div>
</section>

<section id="sec-coin" hidden>
  <div class="cells" id="coinCells"></div>
  <div class="panel"><div class="k">cumulative pnl per coin</div><div class="ch"><canvas id="cCoin"></canvas></div></div>
</section>

<section id="sec-feed" hidden>
  <div class="seg" id="seg">
    <button data-m="best" class="on">best</button>
    <button data-m="worst">worst</button>
    <button data-m="trades">trades</button>
    <button data-m="activity">activity</button>
  </div>
  <div id="list"></div>
</section>
</main>

<nav class="tabs" id="tabs">
  <button data-t="ov" class="on"><span class="i">◎</span>overview</button>
  <button data-t="edge"><span class="i">⌁</span>edge</button>
  <button data-t="coin"><span class="i">◈</span>coins</button>
  <button data-t="feed"><span class="i">≡</span>feed</button>
</nav>

<script>
const EMBEDDED=null; // replaced by make_snapshot.py with a raw event dump
const API='https://data-api.polymarket.com';
const CUTOFF=7200;           // s of silence after which leftover shares count as worthless
const PAGE=500, MAX_PAGES=40, ROLL=50;

const num=v=>Number(v)||0;
const usd=x=>(x<0?'-$':'$')+Math.abs(x).toFixed(2);
const $=id=>document.getElementById(id);
const fmtT=ts=>{const d=new Date(ts*1e3);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const fmtD=ts=>{const d=new Date(ts*1e3);return `${d.getMonth()+1}/${d.getDate()}`};
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shortTitle=(m)=>{
  const c=m.coin!=='other'?m.coin:'';
  const t=m.title.match(/- (\w+) (\d+), (.+?) ET/);
  const arrow=m.outcome==='Up'?'↑':m.outcome==='Down'?'↓':'';
  return `${c}${arrow} ${t?`${t[1].slice(0,3)} ${t[2]} ${t[3]}`:m.title}`.trim();
};

let view=null, activeTab='ov', feedMode='best', dirty={};
const charts={}; window.charts=charts;

// ---- data ----
async function fetchActivity(user,f,t){
  const all=[];
  for(let p=0;p<MAX_PAGES;p++){
    $('status').textContent=`loading… page ${p+1}`;
    let q=`${API}/activity?user=${user}&limit=${PAGE}&offset=${p*PAGE}`;
    if(f)q+=`&start=${f}`; if(t)q+=`&end=${t}`;
    const r=await fetch(q);
    if(!r.ok) throw new Error(`data-api ${r.status}`);
    const batch=await r.json();
    all.push(...batch);
    if(batch.length<PAGE) return {events:all,capped:false};
  }
  return {events:all,capped:true};
}

function compute(events){
  const mkts=new Map(); let rewards=0;
  events.sort((a,b)=>num(a.timestamp)-num(b.timestamp));
  for(const e of events){
    const t=e.type,u=num(e.usdcSize),sz=num(e.size),ts=num(e.timestamp);
    if(t==='REWARD'){rewards+=u;continue}
    let m=mkts.get(e.conditionId);
    if(!m){m={title:e.title||'',outcome:null,firstTs:ts,lastTs:ts,cashIn:0,cashOut:0,
      buyUsd:0,buyShares:0,legUsd:{},legSh:{},shares:{},redeemed:false};mkts.set(e.conditionId,m)}
    m.lastTs=Math.max(m.lastTs,ts);
    const oi=e.outcomeIndex??0;
    if(t==='TRADE'){
      if(e.side==='BUY'){
        m.cashOut+=u;m.buyUsd+=u;m.buyShares+=sz;
        m.legUsd[oi]=(m.legUsd[oi]||0)+u;m.legSh[oi]=(m.legSh[oi]||0)+sz;
        m.shares[oi]=(m.shares[oi]||0)+sz;
        if(!m.outcome)m.outcome=e.outcome||null;
      }else{m.cashIn+=u;m.shares[oi]=(m.shares[oi]||0)-sz}
    }else if(t==='SPLIT'){m.cashOut+=u;m.shares[0]=(m.shares[0]||0)+sz;m.shares[1]=(m.shares[1]||0)+sz}
    else if(t==='MERGE'){m.cashIn+=u;m.shares[0]=(m.shares[0]||0)-sz;m.shares[1]=(m.shares[1]||0)-sz}
    else if(t==='REDEEM'){m.cashIn+=u;m.redeemed=true;m.shares={}}
  }
  const now=Date.now()/1e3, closed=[], open=[];
  for(const m of mkts.values()){
    const rem=Object.values(m.shares).reduce((a,s)=>a+Math.max(0,s),0);
    m.pnl=m.cashIn-m.cashOut;
    const dom=Object.keys(m.legSh).sort((a,b)=>m.legSh[b]-m.legSh[a])[0]; // dominant leg for entry price
    m.entry=dom!=null&&m.legSh[dom]>0?m.legUsd[dom]/m.legSh[dom]:null;
    const lt=m.title.toLowerCase();
    m.coin=lt.includes('solana')?'SOL':lt.includes('ethereum')?'ETH':'other';
    (m.redeemed||rem<0.01||now-m.lastTs>CUTOFF?closed:open).push(m);
  }

  // aggregates
  const n=closed.length, wins=closed.filter(m=>m.pnl>0);
  const p=n?wins.length/n:0, se=n?Math.sqrt(p*(1-p)/n):0;
  const pnl=closed.reduce((a,m)=>a+m.pnl,0);
  const vol=closed.reduce((a,m)=>a+m.cashOut,0);
  const sh=closed.reduce((a,m)=>a+m.buyShares,0);
  const bu=closed.reduce((a,m)=>a+m.buyUsd,0);
  const winSh=wins.reduce((a,m)=>a+m.buyShares,0);
  const grossW=wins.reduce((a,m)=>a+m.pnl,0);
  const losers=closed.filter(m=>m.pnl<=0);
  const grossL=losers.reduce((a,m)=>a+m.pnl,0);
  const lOut=losers.reduce((a,m)=>a+m.cashOut,0), lIn=losers.reduce((a,m)=>a+m.cashIn,0);

  // daily pnl + sharpe + drawdown
  const byClose=[...closed].sort((a,b)=>a.lastTs-b.lastTs);
  const span=byClose.length?byClose.at(-1).lastTs-byClose[0].lastTs:0;
  const hourly=span<=2*86400;
  const daily=new Map();
  for(const m of byClose){
    const d=new Date(m.lastTs*1e3);
    const k=hourly?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}h`:isoDay(d);
    daily.set(k,(daily.get(k)||0)+m.pnl);
  }
  const dayVals=hourly?[]:[...daily.values()];
  let sharpe=null;
  if(dayVals.length>=3){
    const mean=dayVals.reduce((a,b)=>a+b,0)/dayVals.length;
    const sd=Math.sqrt(dayVals.reduce((a,b)=>a+(b-mean)**2,0)/(dayVals.length-1));
    if(sd>0)sharpe=mean/sd*Math.sqrt(365);
  }
  let acc=0,peak=0,dd=0;
  const cum=byClose.map(m=>{acc+=m.pnl;peak=Math.max(peak,acc);dd=Math.min(dd,acc-peak);return{x:m.lastTs,y:+acc.toFixed(2)}});

  // buckets
  const edges=[0,.70,.75,.80,.85,.90,.95,1.001];
  const lbl=['<70¢','70–75','75–80','80–85','85–90','90–95','95+'];
  const buckets=edges.slice(0,-1).map((_,i)=>({l:lbl[i],n:0,w:0,eSum:0,sh:0,pnl:0}));
  for(const m of closed){
    if(m.entry==null)continue;
    const i=edges.findIndex((e,j)=>m.entry>=e&&m.entry<edges[j+1]); if(i<0)continue;
    const b=buckets[i]; b.n++; if(m.pnl>0)b.w++; b.eSum+=m.entry*m.buyShares; b.sh+=m.buyShares; b.pnl+=m.pnl;
  }

  // rolling edge per share
  const W=Math.min(ROLL,byClose.length), rolling=[];
  if(byClose.length>=10){
    let wp=0,ws=0;
    for(let i=0;i<byClose.length;i++){
      wp+=byClose[i].pnl; ws+=byClose[i].buyShares;
      if(i>=W){wp-=byClose[i-W].pnl; ws-=byClose[i-W].buyShares}
      if(i>=W-1&&ws>0)rolling.push({x:byClose[i].lastTs,y:+(wp/ws*100).toFixed(2)});
    }
  }

  // coins
  const coins={};
  for(const c of['SOL','ETH']){
    const cs=closed.filter(m=>m.coin===c);
    const cw=cs.filter(m=>m.pnl>0).length, csh=cs.reduce((a,m)=>a+m.buyShares,0);
    let a2=0;
    coins[c]={n:cs.length,wr:cs.length?cw/cs.length:0,pnl:cs.reduce((a,m)=>a+m.pnl,0),
      edge:csh?cs.reduce((a,m)=>a+m.pnl,0)/csh*100:null,
      cum:cs.sort((x,y)=>x.lastTs-y.lastTs).map(m=>({x:m.lastTs,y:+(a2+=m.pnl).toFixed(2)}))};
  }

  const trades=events.filter(e=>e.type==='TRADE').sort((a,b)=>num(b.timestamp)-num(a.timestamp)).slice(0,60);
  const activity=[...events].sort((a,b)=>num(b.timestamp)-num(a.timestamp)).slice(0,80);

  return {closed,open,rewards,n,wins:wins.length,p,se,pnl,vol,sh,bu,winSh,grossW,grossL,losers,lOut,lIn,
    daily,hourly,sharpe,dd,cum,buckets,rolling,coins,
    best:[...closed].sort((a,b)=>b.pnl-a.pnl).slice(0,10),
    worst:[...closed].sort((a,b)=>a.pnl-b.pnl).slice(0,10),
    trades,activity,events:events.length};
}

// ---- render ----
function cellHTML(k,v,s,c){return `<div class="cell"><div class="k">${k}</div><div class="v ${c||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}

function renderStats(v){
  const pf=v.grossL<0?(v.grossW/-v.grossL).toFixed(2):'∞';
  const shareWR=v.sh?v.winSh/v.sh:null;
  $('cells').innerHTML=[
    cellHTML('realized pnl',usd(v.pnl),`profit factor ${pf}`,v.pnl>=0?'up':'dn'),
    cellHTML('win rate · markets',v.n?(v.p*100).toFixed(1)+'%':'—',`${v.wins}/${v.n} · ±${(v.se*100).toFixed(1)}pp`),
    cellHTML('edge / share',v.sh?(v.pnl/v.sh*100).toFixed(2)+'¢':'—',
      shareWR!=null?`${(shareWR*100).toFixed(1)}% of shares won · paid ${(v.bu/v.sh*100).toFixed(1)}¢`:''),
    cellHTML('sharpe · daily ann.',v.sharpe!=null?v.sharpe.toFixed(2):'—',`max dd ${usd(v.dd)}`),
    cellHTML('volume',usd(v.vol),`${v.sh.toFixed(0)} shares · avg pos ${v.n?usd(v.vol/v.n):'—'}`),
    cellHTML('recovery on losers',v.lOut?(v.lIn/v.lOut*100).toFixed(1)+'%':'—',`${v.losers.length} losers · ${usd(v.lIn)} back`),
    cellHTML('sol / eth pnl',`<span class="sol">${usd(v.coins.SOL.pnl)}</span> <span class="eth">${usd(v.coins.ETH.pnl)}</span>`,null),
    cellHTML('open now',String(v.open.length),
      `${usd(v.open.reduce((a,m)=>a+m.cashOut-m.cashIn,0))} at risk · rewards ${usd(v.rewards)}`),
  ].join('');
}

function renderCoinCells(v){
  $('coinCells').innerHTML=['SOL','ETH'].map(c=>{
    const x=v.coins[c];
    return cellHTML(c,usd(x.pnl),
      `${x.n} mkts · wr ${x.n?(x.wr*100).toFixed(1):'—'}% · ${x.edge!=null?x.edge.toFixed(2)+'¢/sh':'—'}`,
      x.pnl>=0?(c==='SOL'?'sol':'eth'):'dn');
  }).join('');
}

function posRow(m){
  return `<div class="row"><div class="l"><div class="t">${shortTitle(m)}</div>
    <div class="m">${fmtT(m.lastTs)} · in ${m.entry?(m.entry*100).toFixed(1)+'¢':'—'} · cost ${usd(m.cashOut)}</div></div>
    <div class="r ${m.pnl>=0?'up':'dn'}">${usd(m.pnl)}</div></div>`;
}
function tradeRow(e){
  const buy=e.side==='BUY';
  return `<div class="row"><div class="l"><div class="t"><span class="${buy?'up':'dn'}">${buy?'BUY':'SELL'}</span> ${e.outcome||''} · ${(e.title||'').replace(' Up or Down','')}</div>
    <div class="m">${fmtT(num(e.timestamp))}</div></div>
    <div class="r">${(num(e.price)*100).toFixed(1)}¢ × ${num(e.size).toFixed(0)}<div class="m">${usd(num(e.usdcSize))}</div></div></div>`;
}
function actRow(e){
  if(e.type==='TRADE')return tradeRow(e);
  const label={REDEEM:'REDEEM',REWARD:'REWARD',SPLIT:'SPLIT',MERGE:'MERGE',CONVERSION:'CONV'}[e.type]||e.type;
  return `<div class="row"><div class="l"><div class="t"><span class="${e.type==='REWARD'?'up':''}">${label}</span> ${(e.title||'').replace(' Up or Down','')}</div>
    <div class="m">${fmtT(num(e.timestamp))}</div></div>
    <div class="r up">+${usd(num(e.usdcSize))}</div></div>`;
}
function renderFeed(v){
  const l=$('list');
  const src={best:v.best.map(posRow),worst:v.worst.map(posRow),
    trades:v.trades.map(tradeRow),activity:v.activity.map(actRow)}[feedMode];
  l.innerHTML=src.length?src.join(''):'<div class="empty">nothing in range</div>';
}

// ---- charts ----
const GRID={color:'rgba(255,255,255,.05)'}, TICK={color:'#78828F',font:{size:10}};
const XT={type:'linear',grid:GRID,ticks:{...TICK,maxTicksLimit:6,callback:v=>fmtD(v)}};
function draw(id,cfg){charts[id]?.destroy();charts[id]=new Chart($(id),cfg)}
const NOLEG={plugins:{legend:{display:false}},maintainAspectRatio:false};

function drawTab(t){
  if(!view||!dirty[t])return; const v=view; dirty[t]=false;
  if(t==='ov'){
    draw('cCum',{type:'line',data:{datasets:[{data:v.cum,borderColor:'#F5B84B',borderWidth:1.5,pointRadius:0,
      fill:{target:'origin',above:'rgba(52,211,153,.06)',below:'rgba(248,113,113,.08)'}}]},
      options:{...NOLEG,parsing:false,interaction:{intersect:false,mode:'nearest'},
      scales:{x:XT,y:{grid:GRID,ticks:{...TICK,callback:x=>'$'+x}}}}});
    $('kDaily').textContent=v.hourly?'pnl per hour':'pnl per day';
    const ks=[...v.daily.keys()],ys=[...v.daily.values()].map(x=>+x.toFixed(2));
    draw('cDaily',{type:'bar',data:{labels:ks.map(k=>v.hourly?k:k.slice(5)),datasets:[{data:ys,
      backgroundColor:ys.map(x=>x>=0?'rgba(52,211,153,.6)':'rgba(248,113,113,.6)'),borderRadius:4}]},
      options:{...NOLEG,scales:{x:{grid:{display:false},ticks:{...TICK,maxTicksLimit:10,maxRotation:0}},
      y:{grid:GRID,ticks:{...TICK,callback:x=>'$'+x}}}}});
  }
  if(t==='edge'){
    const kb=v.buckets.filter(b=>b.n>0);
    const labels=kb.map(b=>[b.l,`n=${b.n}`]);
    const realized=kb.map(b=>+(b.w/b.n*100).toFixed(1));
    const implied=kb.map(b=>+(b.eSum/b.sh*100).toFixed(1));
    const delta=kb.map((b,i)=>+(realized[i]-implied[i]).toFixed(1));
    draw('cEdgeB',{type:'bar',data:{labels,datasets:[{data:delta,
      backgroundColor:delta.map(x=>x>=0?'rgba(52,211,153,.65)':'rgba(248,113,113,.65)'),borderRadius:4}]},
      options:{...NOLEG,scales:{x:{grid:{display:false},ticks:TICK},
      y:{grid:{...GRID,color:c=>c.tick.value===0?'rgba(245,184,75,.5)':'rgba(255,255,255,.05)'},
      ticks:{...TICK,callback:x=>x+'pp'}}}}});
    draw('cBP',{type:'bar',data:{labels,datasets:[{data:kb.map(b=>+b.pnl.toFixed(2)),
      backgroundColor:kb.map(b=>b.pnl>=0?'rgba(52,211,153,.65)':'rgba(248,113,113,.65)'),borderRadius:4}]},
      options:{...NOLEG,scales:{x:{grid:{display:false},ticks:TICK},y:{grid:GRID,ticks:{...TICK,callback:x=>'$'+x}}}}});
    draw('cCal',{data:{labels,datasets:[
      {type:'bar',label:'realized',data:realized,backgroundColor:'rgba(245,184,75,.55)',borderRadius:4},
      {type:'line',label:'implied',data:implied,borderColor:'#D6DCE6',borderDash:[5,4],borderWidth:1.2,pointRadius:2.5,pointBackgroundColor:'#D6DCE6'}]},
      options:{maintainAspectRatio:false,plugins:{legend:{labels:{...TICK,boxWidth:10}}},
      scales:{x:{grid:{display:false},ticks:TICK},y:{grid:GRID,ticks:{...TICK,callback:x=>x+'%'},suggestedMin:30,suggestedMax:100}}}});
    draw('cRoll',{type:'line',data:{datasets:[{data:v.rolling,borderColor:'#F5B84B',borderWidth:1.5,pointRadius:0}]},
      options:{...NOLEG,parsing:false,scales:{x:XT,
      y:{grid:{...GRID,color:c=>c.tick.value===0?'rgba(245,184,75,.5)':'rgba(255,255,255,.05)'},
      ticks:{...TICK,callback:x=>x+'¢'}}}}});
  }
  if(t==='coin'){
    draw('cCoin',{type:'line',data:{datasets:[
      {label:'SOL',data:v.coins.SOL.cum,borderColor:'#A15CFF',borderWidth:1.5,pointRadius:0},
      {label:'ETH',data:v.coins.ETH.cum,borderColor:'#7B94F5',borderWidth:1.5,pointRadius:0}]},
      options:{maintainAspectRatio:false,parsing:false,plugins:{legend:{labels:{...TICK,boxWidth:10}}},
      interaction:{intersect:false,mode:'nearest'},
      scales:{x:XT,y:{grid:GRID,ticks:{...TICK,callback:x=>'$'+x}}}}});
  }
}

// ---- controls ----
function range(){
  const f=$('dFrom').value?new Date($('dFrom').value+'T00:00:00').getTime()/1e3:0;
  const t=$('dTo').value?new Date($('dTo').value+'T23:59:59').getTime()/1e3:0;
  return [Math.floor(f),Math.floor(t)];
}
function setChip(days){
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.d===days));
  const now=new Date();
  $('dTo').value=isoDay(now);
  if(days){$('dFrom').value=isoDay(new Date(now.getTime()-days*86400e3))}
  else if(EMBEDDED&&EMBEDDED.length){$('dFrom').value=isoDay(new Date(Math.min(...EMBEDDED.map(e=>num(e.timestamp)))*1e3))}
  else{$('dFrom').value=''}
}
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{setChip(+b.dataset.d);refresh()});
$('dFrom').onchange=$('dTo').onchange=()=>{document.querySelectorAll('#chips button').forEach(b=>b.classList.remove('on'));refresh()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  activeTab=b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!=='sec-'+activeTab);
  drawTab(activeTab);
});
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  feedMode=b.dataset.m;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  if(view)renderFeed(view);
});

async function refresh(){
  const st=$('status'); st.classList.remove('err');
  try{
    const t0=performance.now();
    const [f,t]=range();
    let events,capped=false;
    if(EMBEDDED){events=EMBEDDED.filter(e=>{const ts=num(e.timestamp);return(!f||ts>=f)&&(!t||ts<=t)})}
    else ({events,capped}=await fetchActivity($('wallet').value.trim(),f,t));
    view=compute(events);
    renderStats(view); renderCoinCells(view); renderFeed(view);
    dirty={ov:1,edge:1,coin:1}; drawTab(activeTab);
    let note='';
    if(EMBEDDED&&EMBEDDED.length&&f){
      const min=Math.min(...EMBEDDED.map(e=>num(e.timestamp)));
      if(f<min-86400)note=` · ⚠ snapshot starts ${fmtD(min)}`;
    }
    st.textContent=`${view.n} markets · ${view.events} events · ${((performance.now()-t0)/1e3).toFixed(1)}s`
      +(EMBEDDED?' · snapshot':'')+note+(capped?` · ${PAGE*MAX_PAGES}-event cap hit`:'');
  }catch(e){
    st.classList.add('err');
    st.textContent=`${e.message} — if this is a blocked fetch, use the snapshot page`;
  }
}
setChip(7);
refresh();
</script>
